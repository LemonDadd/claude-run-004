services:
  lunar-calendar:
    build: .
    image: lunar-calendar:latest
    container_name: lunar-calendar
    ports:
      - "8000:8000"
    volumes:
      - lunar-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  lunar-data:
